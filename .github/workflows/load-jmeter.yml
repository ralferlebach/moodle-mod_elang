##############################################################################
# Load test (JMeter) – mod_elang
#
# Manual only, and available on EVERY branch: the "Run workflow" button offers
# a branch selector, so a load run can be started against development, a
# feature branch or main without merging anything first.
#
# NOTE: the button only appears in the Actions UI once this file exists on the
# repository's DEFAULT branch. From then on it can target any branch.
#
# Two modes:
#   selfcontained (default) — build a fresh Moodle, install this plugin, seed a
#                             50-cue exercise and load-test it here.
#   external                — point at a Moodle you already run and seeded
#                             (enter base_url, token and versionid).
#
# The second, independent measurement of the same read path. It exists next to
# the k6 workflow on purpose: two tools measuring one endpoint can disagree, and
# a disagreement is information neither of them could produce alone. Same
# fixture, same endpoint, same latency limit — only the measuring instrument
# differs.
#
# Like k6 this is a trend instrument, not a gate, and deliberately outside the
# blocking pipeline: a hosted runner's throughput varies enough that a threshold
# in a pull request would produce false alarms rather than signal. The plan's own
# assertions still fail the run, so a genuine collapse is loud.
#
# It needs a JVM, which nothing else in this repository does. That is the price
# of the independent check and the reason it is manual only.
#
# Artefacts are uploaded on success as well as on failure — a load result is
# only meaningful when compared with earlier ones, so the green runs are
# exactly the ones worth keeping.
##############################################################################

name: Load test (JMeter)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'selfcontained (build+seed here) or external (your own site)'
        type: choice
        options: [selfcontained, external]
        default: selfcontained
        required: true
      scenario:
        description: 'smoke (25), classroom (200) or lecturehall (2000) threads, all on 50 cues'
        type: choice
        options: [smoke, classroom, lecturehall, custom]
        default: smoke
        required: true
      base_url:
        description: '[external mode] Base URL of your seeded Moodle'
        required: false
      token:
        description: '[external mode] Web service token of the seeded user'
        required: false
      versionid:
        description: '[external mode] Published elang_version id to read'
        required: false
      threads:
        description: '[custom] Concurrent threads'
        default: '200'
        required: false
      loops:
        description: '[custom] Requests per thread'
        default: '20'
        required: false
      p95:
        description: 'p95 latency in ms above which the run fails'
        default: '800'
        required: false
      p95target:
        description: 'p95 latency in ms the exercise should meet (reported, does not fail)'
        default: '300'
        required: false

concurrency:
  group: load-k6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  k6:
    name: "JMeter (${{ github.event.inputs.mode }} / ${{ github.event.inputs.scenario }})"
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000
      # Pinned: a load result is comparable with the next one only if the tool
      # that produced it is the same.
      JMETER_VERSION: 5.6.3

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
          coverage: none

      - name: Resolve the scenario
        id: scenario
        run: |
          # The same three shapes as the k6 workflow, so the two tools measure
          # comparable load. JMeter drives a fixed number of requests per thread
          # rather than a plateau duration, so the loop count stands in for the
          # duration — the total request volume is what has to match, not the
          # wall clock.
          # Threads only provide parallelism; the arrival rate is what the
          # scenario actually specifies, and a throughput timer in the plan
          # enforces it. Ten threads are plenty: a session is one read plus one
          # media request, so almost nothing runs at once.
          #
          # A bigger thread count is actively harmful here — 50 threads ramping
          # over 10 s fire before the timer can pace them, and that opening
          # burst alone produced a p95 of 4.5 s against a server whose median
          # was 37 ms.
          window=180
          case "${{ github.event.inputs.scenario }}" in
            smoke)       learners=25 ;;
            classroom)   learners=200 ;;
            lecturehall) learners=2000 ;;
            *)           learners="${{ github.event.inputs.threads }}" ;;
          esac

          threads=10
          # Rounded up, not down. Integer division loses learners silently —
          # smoke would have run 20 sessions while reporting 25.
          loops=$(( (learners + threads - 1) / threads ))
          [ "$loops" -lt 1 ] && loops=1
          echo "Sitzungen tatsaechlich: $(( threads * loops )) (angefordert: $learners)"
          arrivals=$(( learners * 60 / window ))

          {
            echo "learners=$learners"
            echo "threads=$threads"
            echo "loops=$loops"
            echo "rampup=30"
            echo "arrivals=$arrivals"
            echo "cues=50"
          } >> "$GITHUB_OUTPUT"

      - name: Build, install and seed a self-contained site
        id: selfcontained
        if: ${{ github.event.inputs.mode == 'selfcontained' }}
        run: |
          git clone --depth 1 --branch "$MOODLE_BRANCH" \
            https://github.com/moodle/moodle.git moodle
          rm -rf moodle/mod/elang
          mkdir -p moodle/mod
          cp -a plugin moodle/mod/elang
          rm -rf moodle/mod/elang/.git

          mkdir -p /tmp/moodledata
          cd moodle
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid

          # No web server is started here: seeding is a CLI script and needs
          # none, and a background server does not reliably survive beyond the
          # step that started it. Every step needing HTTP starts its own.
          #
          # seed_large.php prints "export KEY='value'" lines (BASE_URL, TOKEN,
          # CMID, VERSIONID); expose the ones the load plan needs as outputs.
          php mod/elang/tests/load/seed_large.php "${{ steps.scenario.outputs.cues }}" > /tmp/seed.env
          get() { sed -n "s/^export $1='\(.*\)'$/\1/p" /tmp/seed.env; }
          {
            echo "base_url=$(get BASE_URL)"
            echo "versionid=$(get VERSIONID)"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$(get TOKEN)"
          echo "token=$(get TOKEN)" >> "$GITHUB_OUTPUT"

      - name: Resolve run parameters
        id: params
        run: |
          if [ "${{ github.event.inputs.mode }}" = "external" ]; then
            for name in base_url token versionid; do
              case "$name" in
                base_url)  value="${{ github.event.inputs.base_url }}" ;;
                token)     value="${{ github.event.inputs.token }}" ;;
                versionid) value="${{ github.event.inputs.versionid }}" ;;
              esac
              if [ -z "$value" ]; then
                echo "Im Modus 'external' muss '$name' angegeben werden."
                exit 1
              fi
            done
            echo "::add-mask::${{ github.event.inputs.token }}"
            {
              echo "base_url=${{ github.event.inputs.base_url }}"
              echo "token=${{ github.event.inputs.token }}"
              echo "versionid=${{ github.event.inputs.versionid }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "base_url=${{ steps.selfcontained.outputs.base_url }}"
              echo "token=${{ steps.selfcontained.outputs.token }}"
              echo "versionid=${{ steps.selfcontained.outputs.versionid }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JMeter
        run: |
          # Pinned, and fetched from the Apache archive rather than the mirror
          # redirector: a load result is only comparable with the next one if the
          # tool that produced it is the same.
          curl -fsSL "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz" \
            -o /tmp/jmeter.tgz
          tar xzf /tmp/jmeter.tgz -C /tmp
          echo "/tmp/apache-jmeter-${JMETER_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Run the read-endpoint load plan
        run: |
          if [ "${{ github.event.inputs.mode }}" = "selfcontained" ]; then
            # Multiple workers so parallel requests do not serialise. Started
            # inside THIS step so it is alive for the whole run. Bound to
            # 127.0.0.1 rather than "localhost": the built-in server listens on
            # one address, while k6 may resolve "localhost" to ::1 and report
            # connection errors as HTTP 0.
            PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t moodle \
              >/tmp/moodle-server.log 2>&1 &
            ready=0
            for i in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                http://127.0.0.1:8000/login/index.php || true)
              if [ "$code" = "200" ]; then ready=1; break; fi
              sleep 3
            done
            if [ "$ready" != "1" ]; then
              echo "Der Moodle-Testserver ist nicht erreichbar geworden (letzter HTTP-Status: $code)."
              tail -50 /tmp/moodle-server.log || true
              exit 1
            fi
          fi

          # Pre-flight: confirm the target answers before generating load. A
          # dead server otherwise surfaces as "100% of requests failed" and
          # looks like a plugin problem.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "${{ steps.params.outputs.base_url }}/login/index.php" || true)
          if [ "$code" != "200" ]; then
            echo "Ziel ist nicht erreichbar (HTTP $code): ${{ steps.params.outputs.base_url }}"
            tail -50 /tmp/moodle-server.log || true
            exit 1
          fi

          # -n: no GUI. The .jtl holds every sample, the HTML report is what a
          # human reads, and both are uploaded.
          jmeter -n -t plugin/tests/load/elang-read-endpoints.jmx \
            -Jbase_url='${{ steps.params.outputs.base_url }}' \
            -Jtoken='${{ steps.params.outputs.token }}' \
            -Jversionid='${{ steps.params.outputs.versionid }}' \
            -Jcmid='${{ steps.params.outputs.cmid }}' \
            -Jthreads='${{ steps.scenario.outputs.threads }}' \
            -Jrampup='${{ steps.scenario.outputs.rampup }}' \
            -Jloops='${{ steps.scenario.outputs.loops }}' \
            -Jarrivals_per_minute='${{ steps.scenario.outputs.arrivals }}' \
            -Jp95='${{ github.event.inputs.p95 }}' \
            -l jmeter-results.jtl -e -o jmeter-report

          # JMeter exits 0 even when assertions failed, so the samples decide.
          # Without this the workflow would report a green run over a wall of
          # failed requests.
          failures=$(awk -F, 'NR>1 && $8=="false"' jmeter-results.jtl | wc -l)
          total=$(( $(wc -l < jmeter-results.jtl) - 1 ))
          echo "samples=$total failures=$failures"

          # A request without a query string means the plan is broken, not the
          # server. JMeter silently drops configured arguments when the path
          # holds an absolute URL, and the symptom is indistinguishable from an
          # outage unless it is named.
          if ! awk -F',' 'NR==2 {exit ($14 ~ /wsfunction=/) ? 0 : 1}' jmeter-results.jtl; then
            echo "Die aufgerufene URL enthält keine Parameter — der Testplan ist fehlerhaft,"
            echo "nicht das Ziel. Erste URL:"
            awk -F',' 'NR==2 {print "  " $14}' jmeter-results.jtl
            exit 1
          fi
          if [ "$total" -eq 0 ]; then
            echo "Keine Messwerte — der Lauf hat den Endpunkt nicht erreicht."
            exit 1
          fi
          # The same 1% error budget as the k6 plan.
          if [ "$(( failures * 100 ))" -gt "$total" ]; then
            echo "Mehr als 1 % der Anfragen sind fehlgeschlagen ($failures von $total)."
            echo ""
            # Why they failed, not just how many. A plan that sends a malformed
            # request produces 100% failures at a few milliseconds each, which
            # reads exactly like a dead server until you see the message — that
            # cost a full debugging round once already.
            echo "Erste Fehlermeldungen aus der .jtl:"
            awk -F',' 'NR>1 && $8=="false" {print "  " $4 " " $5 " :: " $9}' jmeter-results.jtl \
              | sort | uniq -c | sort -rn | head -5
            echo ""
            echo "Aufgerufene URL (erste Zeile):"
            awk -F',' 'NR==2 {print "  " $14}' jmeter-results.jtl
            exit 1
          fi

      - name: Show the tail of the server log on failure
        if: failure() && github.event.inputs.mode == 'selfcontained'
        run: tail -100 /tmp/moodle-server.log || true

      - name: Write a run description alongside the numbers
        if: always()
        run: |
          # A load summary is only interpretable next to the conditions it was
          # produced under, and a hosted runner is not a fixed reference point.
          {
            echo "ref:       ${{ github.ref }}"
            echo "sha:       ${{ github.sha }}"
            echo "mode:      ${{ github.event.inputs.mode }}"
            echo "scenario:  ${{ github.event.inputs.scenario }}"
            echo "learners:  ${{ steps.scenario.outputs.learners }}"
            echo "arrival:   180s"
            echo "threads:   ${{ steps.scenario.outputs.threads }}"
            echo "cues:      ${{ steps.scenario.outputs.cues }}"
            echo "loops:     ${{ steps.scenario.outputs.loops }}"
            echo "rampup:    ${{ steps.scenario.outputs.rampup }}s"
            echo "limit:     ${{ github.event.inputs.p95 }}ms per request (assertion)"
            echo "jmeter:    ${JMETER_VERSION}"
            echo "runner:    $(nproc) CPUs, $(free -m | awk '/^Mem:/{print $2}') MB RAM"
            echo "status:    ${{ job.status }}"
          } > jmeter-run-context.txt
          cat jmeter-run-context.txt

      # Always uploaded, unlike the lint/test pipelines: a load result only
      # means something compared with earlier ones, so the green runs are
      # exactly the ones worth keeping.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results-${{ github.run_number }}
          path: |
            jmeter-results.jtl
            jmeter-report
            jmeter-run-context.txt
          retention-days: 30
          if-no-files-found: ignore

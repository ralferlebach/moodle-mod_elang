##############################################################################
# GitHub Actions CI – mod_elang
#
# Triggered on push / PR to any branch EXCEPT main (dev workflow).
#
# Supported range: Moodle 4.5 LTS … 5.3 LTS, PHP 8.1 … 8.4.
#
# The matrix deliberately samples that range instead of forming the full cross
# product, and it respects the per-release PHP bounds:
#   Moodle 4.5 → PHP 8.1 – 8.3   (minimum 8.1)
#   Moodle 5.0 → PHP 8.2 – 8.3   (minimum 8.2)
#   Moodle 5.2 → PHP 8.3 – 8.4   (minimum 8.3)
#   Moodle 5.3 → PHP 8.3 – 8.4   (not released yet, built from `main`)
#
# Moodle 5.3 is still under active development, and testing against `main`
# genuinely can and does surface Moodle-side debugging()/deprecation output
# that has nothing to do with this plugin — moodle-plugin-ci's own install
# step treats any such output as a hard failure (see MoodleProcess.php in
# moodlehq/moodle-plugin-ci). `main` is therefore tested in its OWN dedicated
# jobs (phpunit-experimental, behat-experimental) rather than as an extra
# matrix entry inside the blocking phpunit/behat jobs.
#
# IMPORTANT — do not "simplify" this by adding `main` back into the phpunit/
# behat matrix with a job-level `continue-on-error: ${{ matrix.experimental }}`.
# That was tried and does not work as it looks like it should: job-level
# continue-on-error masks the job's *result* for `needs:` gating, but the
# overall workflow RUN still shows as failed, which is exactly as confusing
# to a human glancing at the checks list as a real failure. continue-on-error
# only reliably keeps the whole run green when applied to every STEP that can
# fail, which is why every step below in the *-experimental jobs sets it
# individually instead of relying on a single job-level setting.
#
# After Moodle 5.3 is released (5 October 2026): replace `main` with
# MOODLE_503_STABLE in the experimental jobs below, remove the per-step
# continue-on-error, and fold them back into the regular phpunit/behat jobs'
# matrices as ordinary blocking entries.
#
# The plugin has NO external plugin dependencies.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

# A second push to the same branch makes the first run's result irrelevant, and
# the matrix is wide enough that letting superseded runs finish wastes minutes
# that queue behind the run people are actually waiting for.
concurrency:
  group: ci-dev-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MOODLE_CI: '^4'
  # Pinned so the pre-pull step and moodle-plugin-ci agree on the image.
  MOODLE_BEHAT_SELENIUM_IMAGE: 'selenium/standalone-chrome:4'
  PGPASSWORD: moodle
  # Make npm resilient to transient GitHub download failures (ECONNRESET / 503 /
  # socket hang up) while moodle-plugin-ci's node setup fetches tarballs such as
  # shifter and istanbul. These control npm's built-in retry/backoff so a single
  # flaky download no longer fails the whole matrix job.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '300000'

jobs:

  # ── 1a. PHP Lint (lower and upper bound of the supported PHP range) ──────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      # Every check below runs even when an earlier one failed, and every one
      # keeps its full output in ci-logs/. Without both, the first failing check
      # hides the state of all the others and the run tells you one problem at a
      # time. `set -o pipefail` is required or `tee` would mask the exit code.
      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint plugin 2>&1 | tee ci-logs/phplint.log

      - name: PHP CodeSniffer (Moodle coding standard)
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcs plugin --max-warnings 0 2>&1 | tee ci-logs/phpcs.log

      - name: PHP Mess Detector
        if: ${{ always() }}
        continue-on-error: true
        run: set -o pipefail; moodle-plugin-ci phpmd plugin 2>&1 | tee ci-logs/phpmd.log

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          {
            echo "job:    lint-php (PHP ${{ matrix.php }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo "sha:    ${{ github.sha }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-lint-php-${{ matrix.php }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── 1b. JS / Mustache / PHPDoc Lint (against the 4.5 LTS baseline) ───────
  #
  # This job needs a database only as a throwaway target for the one-off
  # `moodle-plugin-ci install --no-init` below — grunt/phpdoc/mustache/validate/
  # savepoints all run against the installed code tree, never against real data,
  # so the DB engine is irrelevant here. It therefore uses the MySQL that ships
  # preinstalled on the ubuntu-24.04 runner (started in a step below) rather than
  # a mariadb:10.11 Docker service.
  #
  # Why: a `services:` container image is pulled from Docker Hub BEFORE any step
  # runs, with no retry the workflow can influence. A transient Hub timeout
  # (`context deadline exceeded` on registry-1.docker.io) then fails the whole
  # job at container-start — which reads as a lint failure even though no lint
  # ran. Using the preinstalled DB removes that Docker Hub dependency for this
  # job entirely (and starts in ~3s instead of a pull).
  #
  # The blocking phpunit/behat jobs deliberately KEEP their Docker service
  # containers: they must test against real MariaDB AND PostgreSQL engines
  # (the MariaDB-only options-column bug is exactly why that coverage matters),
  # so they stay dependent on Docker Hub by design. A transient Hub pull failure
  # there is infrastructure, not a plugin fault — the remedy is to re-run the job.
  lint-js:
    name: "JS / Mustache / PHPDoc Lint"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Start preinstalled MySQL (no Docker Hub pull)
        run: |
          sudo systemctl start mysql.service
          until sudo mysqladmin ping --silent; do sleep 1; done
          sudo mysql --user=root --password=root -e "
            CREATE USER IF NOT EXISTS 'moodle'@'%' IDENTIFIED WITH mysql_native_password BY 'moodle';
            GRANT ALL PRIVILEGES ON *.* TO 'moodle'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;"

      - name: Install Moodle 4.5 baseline (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch MOODLE_405_STABLE \
            --db-type mysqli \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user moodle \
            --db-pass moodle \
            --db-name moodle \
            --no-init
        env:
          DB: mysqli
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Set up Node.js 22
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
    
      - name: Install Node dependencies
        run: |
             npm install
             npm audit fix --force
             npx browserslist@latest --update-db
        working-directory: ${{ github.workspace }}/moodle

      - name: Grunt – AMD / ESLint / Stylelint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee ci-logs/grunt.log

      - name: PHPDoc check
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log

      - name: Mustache lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci mustache 2>&1 | tee ci-logs/mustache.log

      - name: Validate plugin structure
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log

      # ── The React/TypeScript editor ──────────────────────────────────────
      #
      # moodle-plugin-ci knows nothing about this part of the plugin: grunt
      # covers amd/src, but the editor is a separate esbuild/Jest project under
      # js/. Its 36 unit tests, its type checking and the reproducibility of the
      # committed bundle had no CI coverage at all until now — they were only
      # ever verified by hand before a release.
      # These four steps run in the plugin checkout, not the workspace root, so
      # their log targets are anchored to $GITHUB_WORKSPACE. A relative
      # ci-logs/ would resolve inside the plugin directory, where it does not
      # exist — tee then fails and the step's output is lost precisely when it
      # is needed.
      - name: Set up Node for the editor toolchain
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install editor dependencies
        if: ${{ always() }}
        run: set -o pipefail; npm ci 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/npm-ci.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: TypeScript type check
        if: ${{ always() }}
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/tsc.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: Jest – editor unit tests
        if: ${{ always() }}
        run: set -o pipefail; npm test 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/jest.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: The committed React bundle must be reproducible
        if: ${{ always() }}
        run: |
          # The production server ships js/vendor/react/editor.bundle.js and
          # never builds it, so a bundle that no longer matches its sources is
          # invisible until a user hits the stale behaviour. Rebuilding and
          # comparing turns that into a build failure.
          set -o pipefail
          {
            before=$(sha256sum js/vendor/react/editor.bundle.js | cut -d' ' -f1)
            npm run build
            after=$(sha256sum js/vendor/react/editor.bundle.js | cut -d' ' -f1)
            echo "committed: $before"
            echo "rebuilt:   $after"
            if [ "$before" != "$after" ]; then
              echo "Das eingecheckte React-Bundle entspricht nicht seinen Quellen."
              echo "Bitte 'npm run build' ausfuehren und das Ergebnis mit einchecken."
              exit 1
            fi
            echo "Bundle ist reproduzierbar."
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/bundle.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          {
            echo "job:    lint-js"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo "sha:    ${{ github.sha }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-lint-js
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── 2. PHPUnit (blocking — Moodle 4.5, 5.0, 5.2 only) ────────────────────
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.1', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle: MOODLE_405_STABLE, php: '8.3', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle: MOODLE_500_STABLE, php: '8.2', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle: MOODLE_502_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle: MOODLE_502_STABLE, php: '8.4', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: PHPUnit – all tests
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --testdox 2>&1 | tee ci-logs/phpunit.log

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          {
            echo "job:    phpunit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo "sha:    ${{ github.sha }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-phpunit-${{ matrix.moodle }}-${{ matrix.php }}-${{ matrix.db.engine }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── 3. Behat (blocking — Moodle 4.5, 5.2 only) ───────────────────────────
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }} / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.3' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}

      # moodle-plugin-ci starts Selenium with `docker run`, which pulls the image
      # implicitly and gives up on the first failure — a transient Docker Hub
      # 500 then surfaces as "Can't start Selenium server" and reads like a
      # Behat problem. Pulling it here first, with backoff, means `docker run`
      # finds the image locally and never talks to the registry. The image tag
      # is pinned through MOODLE_BEHAT_SELENIUM_IMAGE so this step and
      # moodle-plugin-ci cannot disagree about which one to use.
      - name: Pre-pull the Selenium image
        run: |
          image="${MOODLE_BEHAT_SELENIUM_IMAGE}"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "Selenium-Image nach Versuch $attempt vorhanden."
              exit 0
            fi
            wait=$((attempt * 15))
            echo "Docker-Hub-Pull fehlgeschlagen (Versuch $attempt/5), erneut in ${wait}s ..."
            sleep "$wait"
          done
          echo "Docker Hub hat $image nach 5 Versuchen nicht geliefert."
          echo "Das ist Registry-Infrastruktur, kein Plugin-Fehler - Job bitte neu starten."
          exit 1

      - name: Behat – plugin scenarios
        id: behat
        if: ${{ always() }}
        run: |
          set -o pipefail
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers \
            --dump 2>&1 | tee ci-logs/behat.log

      - name: Collect diagnostics and Behat failure dumps
        if: ${{ always() }}
        run: |
          # moodle-plugin-ci writes failure HTML and screenshots to
          # $CFG->behat_faildump_path, which it sets to <data dir>/behat_dump
          # (see MoodleConfig::BEHATDUMP). The path used before this change,
          # moodle/behatfaildumps/, never existed — every failed Behat run
          # uploaded nothing and logged only "No files were found".
          dump="$GITHUB_WORKSPACE/moodledata/behat_dump"
          if [ -d "$dump" ]; then
            mkdir -p ci-logs/behat_dump
            cp -a "$dump/." ci-logs/behat_dump/
            echo "Behat-Dumps eingesammelt: $(find ci-logs/behat_dump -type f | wc -l) Dateien"
          else
            echo "Kein Behat-Dump-Verzeichnis unter $dump."
          fi
          {
            echo "job:    behat (${{ matrix.moodle }} / PHP ${{ matrix.php }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo "sha:    ${{ github.sha }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-behat-${{ matrix.moodle }}-${{ matrix.php }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── 4. PHPUnit against Moodle main (non-blocking — see header note) ─────
  phpunit-experimental:
    name: "PHPUnit (main / PHP 8.4 / pgsql, experimental)"
    runs-on: ubuntu-24.04
    needs: [lint-php]

    services:
      # PostgreSQL 17, not 16 as the blocking jobs use: Moodle main (5.3)
      # raised its minimum to 17 and refuses to install on 16 with
      # "[System] version 17 is required and you are running 16.15". That is
      # what actually failed this job — not the plugin, and not the install
      # arguments, whose usage text moodle-plugin-ci prints after any install
      # error and which reads misleadingly like a bad option.
      #
      # The blocking jobs stay on 16 deliberately: 4.5 and 5.2 are supported
      # against it and that coverage is proven green.
      pgsql:
        image: postgres:17
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        continue-on-error: true
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        continue-on-error: true
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        continue-on-error: true
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        continue-on-error: true
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        continue-on-error: true
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-user moodle \
            --db-pass moodle \
            --db-name moodle
        env:
          DB: pgsql
          MOODLE_BRANCH: main

      - name: PHPUnit – all tests
        continue-on-error: true
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 5. Behat against Moodle main (non-blocking — see header note) ───────
  behat-experimental:
    name: "Behat (main / PHP 8.4 / Chrome, experimental)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]

    services:
      # MariaDB 11.4, not 10.11: Moodle main (5.3) raised its minimum and
      # refuses to install on the older one with "[System] version 11.4.0 is
      # required and you are running 10.11.19". The same class of failure the
      # experimental PHPUnit job had with PostgreSQL 16 against a required 17.
      # The blocking jobs stay on their proven versions.
      #
      # The health check is MariaDB's own healthcheck.sh, not `mysqladmin ping`
      # as the 10.11 services use. MariaDB 11 dropped the mysql* command
      # aliases, so the old probe never succeeds against this image: the server
      # log shows "ready for connections" and the runner still reports "Failed
      # to initialize container mariadb:11.4", because the container never
      # turns healthy. healthcheck.sh ships inside the image and additionally
      # waits for InnoDB, so the first connection cannot land mid-startup.
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        continue-on-error: true
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        continue-on-error: true
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        continue-on-error: true
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        continue-on-error: true
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        id: install
        continue-on-error: true
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch main \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: main

      # moodle-plugin-ci starts Selenium with `docker run`, which pulls the image
      # implicitly and gives up on the first failure — a transient Docker Hub
      # 500 then surfaces as "Can't start Selenium server" and reads like a
      # Behat problem. Pulling it here first, with backoff, means `docker run`
      # finds the image locally and never talks to the registry. The image tag
      # is pinned through MOODLE_BEHAT_SELENIUM_IMAGE so this step and
      # moodle-plugin-ci cannot disagree about which one to use.
      - name: Pre-pull the Selenium image
        continue-on-error: true
        run: |
          image="${MOODLE_BEHAT_SELENIUM_IMAGE}"
          for attempt in 1 2 3 4 5; do
            if docker pull "$image"; then
              echo "Selenium-Image nach Versuch $attempt vorhanden."
              exit 0
            fi
            wait=$((attempt * 15))
            echo "Docker-Hub-Pull fehlgeschlagen (Versuch $attempt/5), erneut in ${wait}s ..."
            sleep "$wait"
          done
          echo "Docker Hub hat $image nach 5 Versuchen nicht geliefert."
          echo "Das ist Registry-Infrastruktur, kein Plugin-Fehler - Job bitte neu starten."
          exit 1

      # Skipped when the install did not succeed. moodle-plugin-ci takes the
      # plugin directory from the environment the install writes; without it the
      # plugin argument becomes mandatory and the step ends in
      # "Not enough arguments (missing: \"plugin\")" — which hides the install
      # failure that actually caused it behind a usage error.
      - name: Behat – plugin scenarios
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          moodle-plugin-ci behat ./plugin \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers

      # Same corrected path as the blocking Behat job: moodle-plugin-ci writes
      # its fail dumps to <data dir>/behat_dump, not into the Moodle tree.
      - name: Upload failure screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-main-experimental
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  # ── Gate — only the blocking jobs decide the outcome ─────────────────────
  # ── Stale files removed in earlier releases must not still be present ────
  stale-files:
    name: Stale files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Files removed in earlier releases must not still be present
        run: |
          # Unpacking a plugin ZIP adds and overwrites files but never deletes
          # any, so a file removed upstream survives in an installed copy or in
          # a repository updated that way. It then still autoloads, duplicates a
          # class, or reads columns that no longer exist. This turns that into a
          # loud failure instead of confusing downstream errors.
          list=db/removed_files.txt
          if [[ ! -f "$list" ]]; then
            echo "Keine Liste entfernter Dateien vorhanden – nichts zu pruefen."
            exit 0
          fi
          rc=0
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ -e "$path" ]]; then
              echo "Veraltete Datei ist noch vorhanden: $path"
              rc=1
            fi
          done < "$list"
          if [[ $rc -ne 0 ]]; then
            echo "Diese Dateien wurden in frueheren Releases entfernt und muessen geloescht werden."
            exit 1
          fi
          echo "Keine veralteten Dateien gefunden."

  # ── Gate — only the blocking jobs decide the outcome ─────────────────────
  ci-complete:
    name: CI complete
    needs: [lint-php, lint-js, phpunit, behat, stale-files]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All blocking matrix jobs must have succeeded
        run: |
          result="${{ needs.lint-php.result }}-${{ needs.lint-js.result }}-${{ needs.phpunit.result }}-${{ needs.behat.result }}-${{ needs.stale-files.result }}"
          if [[ "$result" == "success-success-success-success-success" ]]; then
            echo "All blocking CI jobs passed. (main/5.3-dev results are informational only — see the phpunit-experimental / behat-experimental jobs.)"
          else
            echo "CI result: $result – one or more blocking jobs failed or were cancelled."
            echo "lint-php:    ${{ needs.lint-php.result }}"
            echo "lint-js:     ${{ needs.lint-js.result }}"
            echo "phpunit:     ${{ needs.phpunit.result }}"
            echo "behat:       ${{ needs.behat.result }}"
            echo "stale-files: ${{ needs.stale-files.result }}"
            exit 1
          fi

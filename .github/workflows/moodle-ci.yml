##############################################################################
# GitHub Actions CI – mod_elang
#
# Triggered on push / PR to any branch EXCEPT main (dev workflow).
#
# Supported range: Moodle 4.5 LTS … 5.3 LTS, PHP 8.1 … 8.4.
#
# The matrix deliberately samples that range instead of forming the full cross
# product, and it respects the per-release PHP bounds:
#   Moodle 4.5 → PHP 8.1 – 8.3   (minimum 8.1)
#   Moodle 5.0 → PHP 8.2 – 8.3   (minimum 8.2)
#   Moodle 5.2 → PHP 8.3 – 8.4   (minimum 8.3)
#   Moodle 5.3 → PHP 8.3 – 8.4   (not released yet, built from `main`)
#
# Moodle 5.3 is still under active development, and testing against `main`
# genuinely can and does surface Moodle-side debugging()/deprecation output
# that has nothing to do with this plugin — moodle-plugin-ci's own install
# step treats any such output as a hard failure (see MoodleProcess.php in
# moodlehq/moodle-plugin-ci). `main` is therefore tested in its OWN dedicated
# jobs (phpunit-experimental, behat-experimental) rather than as an extra
# matrix entry inside the blocking phpunit/behat jobs.
#
# IMPORTANT — do not "simplify" this by adding `main` back into the phpunit/
# behat matrix with a job-level `continue-on-error: ${{ matrix.experimental }}`.
# That was tried and does not work as it looks like it should: job-level
# continue-on-error masks the job's *result* for `needs:` gating, but the
# overall workflow RUN still shows as failed, which is exactly as confusing
# to a human glancing at the checks list as a real failure. continue-on-error
# only reliably keeps the whole run green when applied to every STEP that can
# fail, which is why every step below in the *-experimental jobs sets it
# individually instead of relying on a single job-level setting.
#
# After Moodle 5.3 is released (5 October 2026): replace `main` with
# MOODLE_503_STABLE in the experimental jobs below, remove the per-step
# continue-on-error, and fold them back into the regular phpunit/behat jobs'
# matrices as ordinary blocking entries.
#
# The plugin has NO external plugin dependencies.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  MOODLE_CI: '^4'
  PGPASSWORD: moodle
  # Make npm resilient to transient GitHub download failures (ECONNRESET / 503 /
  # socket hang up) while moodle-plugin-ci's node setup fetches tarballs such as
  # shifter and istanbul. These control npm's built-in retry/backoff so a single
  # flaky download no longer fails the whole matrix job.
  NPM_CONFIG_FETCH_RETRIES: '5'
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: '20000'
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: '120000'
  NPM_CONFIG_FETCH_TIMEOUT: '300000'

jobs:

  # ── 1a. PHP Lint (lower and upper bound of the supported PHP range) ──────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP Lint
        run: moodle-plugin-ci phplint plugin

      - name: PHP CodeSniffer (Moodle coding standard)
        run: moodle-plugin-ci phpcs plugin --max-warnings 0

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # ── 1b. JS / Mustache / PHPDoc Lint (against the 4.5 LTS baseline) ───────
  #
  # This job needs a database only as a throwaway target for the one-off
  # `moodle-plugin-ci install --no-init` below — grunt/phpdoc/mustache/validate/
  # savepoints all run against the installed code tree, never against real data,
  # so the DB engine is irrelevant here. It therefore uses the MySQL that ships
  # preinstalled on the ubuntu-24.04 runner (started in a step below) rather than
  # a mariadb:10.11 Docker service.
  #
  # Why: a `services:` container image is pulled from Docker Hub BEFORE any step
  # runs, with no retry the workflow can influence. A transient Hub timeout
  # (`context deadline exceeded` on registry-1.docker.io) then fails the whole
  # job at container-start — which reads as a lint failure even though no lint
  # ran. Using the preinstalled DB removes that Docker Hub dependency for this
  # job entirely (and starts in ~3s instead of a pull).
  #
  # The blocking phpunit/behat jobs deliberately KEEP their Docker service
  # containers: they must test against real MariaDB AND PostgreSQL engines
  # (the MariaDB-only options-column bug is exactly why that coverage matters),
  # so they stay dependent on Docker Hub by design. A transient Hub pull failure
  # there is infrastructure, not a plugin fault — the remedy is to re-run the job.
  lint-js:
    name: "JS / Mustache / PHPDoc Lint"
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Start preinstalled MySQL (no Docker Hub pull)
        run: |
          sudo systemctl start mysql.service
          until sudo mysqladmin ping --silent; do sleep 1; done
          sudo mysql --user=root --password=root -e "
            CREATE USER IF NOT EXISTS 'moodle'@'%' IDENTIFIED WITH mysql_native_password BY 'moodle';
            GRANT ALL PRIVILEGES ON *.* TO 'moodle'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;"

      - name: Install Moodle 4.5 baseline (no test init)
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch MOODLE_405_STABLE \
            --db-type mysqli \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user moodle \
            --db-pass moodle \
            --db-name moodle \
            --no-init
        env:
          DB: mysqli
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: Grunt – AMD / ESLint / Stylelint
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: Validate plugin structure
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        run: moodle-plugin-ci savepoints

  # ── 2. PHPUnit (blocking — Moodle 4.5, 5.0, 5.2 only) ────────────────────
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.1', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle: MOODLE_405_STABLE, php: '8.3', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle: MOODLE_500_STABLE, php: '8.2', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }
          - { moodle: MOODLE_502_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle } }
          - { moodle: MOODLE_502_STABLE, php: '8.4', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   } }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle
        env:
          DB: ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 3. Behat (blocking — Moodle 4.5, 5.2 only) ───────────────────────────
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }} / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.3' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: ${{ matrix.moodle }}

      - name: Behat – plugin scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle }}-php${{ matrix.php }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7

  # ── 4. PHPUnit against Moodle main (non-blocking — see header note) ─────
  phpunit-experimental:
    name: "PHPUnit (main / PHP 8.4 / pgsql, experimental)"
    runs-on: ubuntu-24.04
    needs: [lint-php]

    services:
      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        continue-on-error: true
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        continue-on-error: true
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        continue-on-error: true
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        continue-on-error: true
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        continue-on-error: true
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-user moodle \
            --db-pass moodle \
            --db-name moodle
        env:
          DB: pgsql
          MOODLE_BRANCH: main

      - name: PHPUnit – all tests
        continue-on-error: true
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 5. Behat against Moodle main (non-blocking — see header note) ───────
  behat-experimental:
    name: "Behat (main / PHP 8.4 / Chrome, experimental)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-retries=10

    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        continue-on-error: true
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        continue-on-error: true
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Set TRAVIS_BRANCH
        continue-on-error: true
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install moodle-plugin-ci
        continue-on-error: true
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle and plugin
        continue-on-error: true
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --branch main \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle
        env:
          DB: mariadb
          MOODLE_BRANCH: main

      - name: Behat – plugin scenarios
        continue-on-error: true
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-main-experimental
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7

  # ── Gate — only the blocking jobs decide the outcome ─────────────────────
  ci-complete:
    name: CI complete
    needs: [phpunit, behat]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All blocking matrix jobs must have succeeded
        run: |
          result="${{ needs.phpunit.result }}-${{ needs.behat.result }}"
          if [[ "$result" == "success-success" ]]; then
            echo "All blocking CI jobs passed. (main/5.3-dev results are informational only — see the phpunit-experimental / behat-experimental jobs.)"
          else
            echo "CI result: $result – one or more blocking jobs failed or were cancelled."
            exit 1
          fi

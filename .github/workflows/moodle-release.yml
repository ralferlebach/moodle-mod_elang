##############################################################################
# GitHub Actions Release CI – mod_elang
#
# Triggered on push / PR to main.
# Provides the "CI complete" status check for branch protection.
#
# Supported range: Moodle 4.5 LTS … 5.3 LTS, PHP 8.1 … 8.4.
# Per-release PHP bounds are respected (4.5 → 8.1-8.3, 5.0 → 8.2-8.3,
# 5.2 → 8.3-8.4, 5.3 → 8.3-8.4).
#
# Moodle 5.3 is still under active development, and testing against `main`
# genuinely can and does surface Moodle-side debugging()/deprecation output
# that has nothing to do with this plugin — moodle-plugin-ci's own install
# step treats any such output as a hard failure. `main` is therefore tested
# in its own dedicated `ci-experimental` job rather than as an extra matrix
# entry inside the blocking `ci` job.
#
# IMPORTANT — do not "simplify" this by adding `main` back into the `ci`
# matrix with a job-level `continue-on-error: ${{ matrix.experimental }}`.
# That was tried and does not work as it looks like it should: job-level
# continue-on-error masks the job's *result* for `needs:` gating, but the
# overall workflow RUN still shows as failed, which is exactly as confusing
# to a human glancing at the checks list as a real failure. continue-on-error
# only reliably keeps the whole run green when applied to every STEP that can
# fail, which is why every step in ci-experimental below sets it individually.
#
# After Moodle 5.3 is released (5 October 2026): replace `main` with
# MOODLE_503_STABLE in ci-experimental, remove its per-step continue-on-error,
# and fold it back into the regular `ci` job's matrix as an ordinary entry.
##############################################################################

name: Moodle Plugin Release CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MOODLE_CI: '^4'
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_AUDIT: 1
  PGPASSWORD: moodle

jobs:

  # ── Blocking matrix — Moodle 4.5, 5.0, 5.2 only ──────────────────────────
  ci:
    name: "CI / ${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Moodle 4.5 LTS — minimum supported release.
          - { moodle-branch: MOODLE_405_STABLE, php: '8.1', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle, name: moodle } }
          - { moodle-branch: MOODLE_405_STABLE, php: '8.3', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root,   name: moodle } }
          # Moodle 5.0 (requires PHP 8.2+).
          - { moodle-branch: MOODLE_500_STABLE, php: '8.2', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root,   name: moodle } }
          # Moodle 5.2 — current stable (requires PHP 8.3+).
          - { moodle-branch: MOODLE_502_STABLE, php: '8.3', db: { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle, name: moodle } }
          - { moodle-branch: MOODLE_502_STABLE, php: '8.4', db: { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root,   name: moodle } }

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 3
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, gd, intl, soap, mbstring, pdo_mysql, pdo_pgsql, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Prepare log directory
        run: mkdir -p ci-logs

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ github.sha }}
          restore-keys: composer-${{ runner.os }}-

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle and plugin
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name ${{ matrix.db.name }}
        env:
          DB:            ${{ matrix.db.type }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      # Every check runs even when an earlier one failed, and every one keeps
      # its full output in ci-logs/. Without both, the first failure hides the
      # state of all the others and a release run reports one problem per
      # attempt. `set -o pipefail` is required or `tee` would mask exit codes.
      - name: PHP Lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phplint 2>&1 | tee ci-logs/phplint.log

      - name: PHP Copy/Paste Detector
        if: ${{ always() }}
        continue-on-error: true
        run: set -o pipefail; moodle-plugin-ci phpcpd 2>&1 | tee ci-logs/phpcpd.log

      - name: Moodle Code Checker (PHPCS)
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpcs --max-warnings 0 2>&1 | tee ci-logs/phpcs.log

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpdoc --max-warnings 0 2>&1 | tee ci-logs/phpdoc.log

      - name: Validate plugin structure
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci validate 2>&1 | tee ci-logs/validate.log

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci savepoints 2>&1 | tee ci-logs/savepoints.log

      - name: Mustache lint
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci mustache 2>&1 | tee ci-logs/mustache.log

      - name: Grunt
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci grunt --max-lint-warnings 0 2>&1 | tee ci-logs/grunt.log

      # The React/TypeScript editor under js/ is a separate esbuild/Jest project
      # that moodle-plugin-ci does not know about. Its unit tests, its type
      # checking and the reproducibility of the committed bundle were verified
      # only by hand before a release until now.
      # These four steps run in the plugin checkout, not the workspace root, so
      # their log targets are anchored to $GITHUB_WORKSPACE. A relative
      # ci-logs/ would resolve inside the plugin directory, where it does not
      # exist — tee then fails and the step's output is lost precisely when it
      # is needed.
      - name: Set up Node for the editor toolchain
        if: ${{ always() }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install editor dependencies
        if: ${{ always() }}
        run: set -o pipefail; npm ci 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/npm-ci.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: TypeScript type check
        if: ${{ always() }}
        run: set -o pipefail; npm run typecheck 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/tsc.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: Jest – editor unit tests
        if: ${{ always() }}
        run: set -o pipefail; npm test 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/jest.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: The committed React bundle must be reproducible
        if: ${{ always() }}
        run: |
          # The production server ships js/vendor/react/editor.bundle.js and
          # never builds it, so a bundle that no longer matches its sources is
          # invisible until a user hits the stale behaviour.
          set -o pipefail
          {
            before=$(sha256sum js/vendor/react/editor.bundle.js | cut -d' ' -f1)
            npm run build
            after=$(sha256sum js/vendor/react/editor.bundle.js | cut -d' ' -f1)
            echo "committed: $before"
            echo "rebuilt:   $after"
            if [ "$before" != "$after" ]; then
              echo "Das eingecheckte React-Bundle entspricht nicht seinen Quellen."
              exit 1
            fi
            echo "Bundle ist reproduzierbar."
          } 2>&1 | tee "$GITHUB_WORKSPACE/ci-logs/bundle.log"
        working-directory: ${{ github.workspace }}/plugin

      - name: PHPUnit
        if: ${{ always() }}
        run: set -o pipefail; moodle-plugin-ci phpunit --fail-on-warning --testdox 2>&1 | tee ci-logs/phpunit.log

      - name: Behat
        id: behat
        if: ${{ always() }}
        run: |
          set -o pipefail
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers \
            --dump 2>&1 | tee ci-logs/behat.log

      - name: Collect diagnostics and Behat failure dumps
        if: ${{ always() }}
        run: |
          # moodle-plugin-ci writes failure HTML and screenshots to
          # $CFG->behat_faildump_path, which it sets to <data dir>/behat_dump
          # (see MoodleConfig::BEHATDUMP) — not into the Moodle tree.
          dump="$GITHUB_WORKSPACE/moodledata/behat_dump"
          if [ -d "$dump" ]; then
            mkdir -p ci-logs/behat_dump
            cp -a "$dump/." ci-logs/behat_dump/
            echo "Behat-Dumps eingesammelt: $(find ci-logs/behat_dump -type f | wc -l) Dateien"
          else
            echo "Kein Behat-Dump-Verzeichnis unter $dump."
          fi
          {
            echo "job:    ci (${{ matrix.moodle-branch }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
            echo "status: ${{ job.status }}"
            echo "ref:    ${{ github.ref }}"
            echo "sha:    ${{ github.sha }}"
            echo ""
            ls -1 ci-logs
          } > ci-logs/summary.txt
          cat ci-logs/summary.txt

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-main-${{ matrix.moodle-branch }}-${{ matrix.php }}-${{ matrix.db.engine }}
          path: ci-logs
          retention-days: 7
          if-no-files-found: ignore

  # ── Moodle main (non-blocking — see header note) ─────────────────────────
  ci-experimental:
    name: "CI / main / PHP 8.4 / pgsql (experimental)"
    runs-on: ubuntu-24.04

    services:
      # PostgreSQL 17, not 16 as the blocking job uses: Moodle main (5.3) raised
      # its minimum to 17 and refuses to install on 16 with
      # "[System] version 17 is required and you are running 16.15". That, and
      # not the plugin, is what failed this job; moodle-plugin-ci prints its
      # install usage text after any install error, which reads misleadingly
      # like a bad option.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s --health-timeout 5s --health-retries 3

    steps:
      - name: Checkout plugin
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP 8.4
        continue-on-error: true
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, gd, intl, soap, mbstring, pdo_mysql, pdo_pgsql, sodium
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        continue-on-error: true
        run: sudo locale-gen en_AU.UTF-8 && sudo update-locale

      - name: Initialise moodle-plugin-ci
        continue-on-error: true
        run: |
          composer create-project -n --no-dev --prefer-dist \
            moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        continue-on-error: true
        run: |
          BRANCH=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle and plugin
        continue-on-error: true
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-port 5432 \
            --db-user moodle \
            --db-pass moodle \
            --db-name moodle
        env:
          DB: pgsql
          MOODLE_BRANCH: main

      - name: PHP Lint
        continue-on-error: true
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker (PHPCS)
        continue-on-error: true
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validate plugin structure
        continue-on-error: true
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        continue-on-error: true
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        continue-on-error: true
        run: moodle-plugin-ci mustache

      - name: Grunt
        continue-on-error: true
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit
        continue-on-error: true
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat
        continue-on-error: true
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@mod_elang&&~@broken" \
            --start-servers

  # ── Gate — only the blocking job decides the outcome ─────────────────────
  # ── Stale files removed in earlier releases must not still be present ────
  stale-files:
    name: Stale files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Files removed in earlier releases must not still be present
        run: |
          # Unpacking a plugin ZIP adds and overwrites files but never deletes
          # any, so a file removed upstream survives in an installed copy or in
          # a repository updated that way. It then still autoloads, duplicates a
          # class, or reads columns that no longer exist.
          list=db/removed_files.txt
          if [[ ! -f "$list" ]]; then
            echo "Keine Liste entfernter Dateien vorhanden – nichts zu pruefen."
            exit 0
          fi
          rc=0
          while IFS= read -r path; do
            [[ -z "$path" || "$path" == \#* ]] && continue
            if [[ -e "$path" ]]; then
              echo "Veraltete Datei ist noch vorhanden: $path"
              rc=1
            fi
          done < "$list"
          if [[ $rc -ne 0 ]]; then
            echo "Diese Dateien wurden in frueheren Releases entfernt und muessen geloescht werden."
            exit 1
          fi
          echo "Keine veralteten Dateien gefunden."

  # ── Gate — only the blocking jobs decide the outcome ─────────────────────
  ci-complete:
    name: CI complete
    needs: [ci, stale-files]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: All blocking matrix jobs must have succeeded
        run: |
          result="${{ needs.ci.result }}-${{ needs.stale-files.result }}"
          if [[ "$result" == "success-success" ]]; then
            echo "All blocking CI jobs passed. (main/5.3-dev result is informational only — see the ci-experimental job.)"
          else
            echo "CI result: $result — one or more blocking jobs failed or were cancelled."
            echo "ci:          ${{ needs.ci.result }}"
            echo "stale-files: ${{ needs.stale-files.result }}"
            exit 1
          fi

##############################################################################
# Playwright – browser and accessibility tests (mod_elang)
#
# These need a live Moodle site with a seeded exercise, so they cannot run
# inside the moodle-plugin-ci static pipeline. Manual, scheduled, and available
# on every branch.
#
# NOTE: the "Run workflow" button only appears in the Actions UI once this file
# exists on the repository's DEFAULT branch. It can then be run against any
# branch from the branch selector.
#
# Behat already covers what the plugin does. Playwright covers what Behat
# structurally cannot: real media playback against a real clock, overlay
# placement over the video, fullscreen, focus movement through actual keyboard
# events, and axe accessibility checks against the rendered page.
#
# Artefacts: unlike the lint/test pipelines, this workflow uploads on success
# as well. A green browser run is evidence of the intended journey and its
# screenshots are reused as documentation; a red one uploads only the failed
# tests plus the server log, because a full report with videos runs to tens of
# megabytes.
##############################################################################

name: Playwright

on:
  workflow_dispatch:
  schedule:
    # Mondays, 03:00 UTC.
    - cron: '0 3 * * 1'

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: "Playwright (MOODLE_405_STABLE / PHP 8.3 / Chromium)"
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: moodle
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      MOODLE_BRANCH: MOODLE_405_STABLE
      MOODLE_WWWROOT: http://127.0.0.1:8000

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, gd, intl, zip, soap, mbstring, curl, xml, exif
          ini-values: max_input_vars=5000
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out Moodle
        run: git clone --depth 1 --branch "$MOODLE_BRANCH" https://github.com/moodle/moodle.git moodle

      - name: Install the plugin into Moodle
        run: |
          # The plugin under test comes from this checkout, never from a clone,
          # so the run always tests the ref it was started on. mod_elang has no
          # sibling plugins and no external plugin dependencies.
          rm -rf moodle/mod/elang
          mkdir -p moodle/mod
          cp -a plugin moodle/mod/elang
          rm -rf moodle/mod/elang/.git

          # A plugin root must contain exactly one version.php. More than one
          # means a repository was copied into an existing plugin directory, in
          # which case the tested tree is not the one this workflow claims.
          count=$(find moodle/mod/elang -name version.php | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "moodle/mod/elang enthält $count version.php (erwartet: genau 1)"
            find moodle/mod/elang -name version.php
            exit 1
          fi
          echo "Plugin-Layout ist sauber."

      # install.php WRITES config.php itself and aborts when one already exists,
      # so we must not pre-create one from config-dist.php. It also requires an
      # existing, writable dataroot outside the Moodle tree — it will not create
      # one.
      - name: Install Moodle site
        run: |
          mkdir -p /tmp/moodledata
          cd moodle
          php admin/cli/install.php \
            --non-interactive --agree-license \
            --dbtype=pgsql --dbhost=127.0.0.1 --dbport=5432 --dbname=moodle \
            --dbuser=moodle --dbpass=moodle \
            --wwwroot="$MOODLE_WWWROOT" --dataroot=/tmp/moodledata \
            --fullname="CI" --shortname="CI" \
            --adminpass="Admin!23" --adminemail=ci@example.invalid

      # seed.php prints shell "export KEY='value'" lines so it can also be
      # sourced locally. $GITHUB_ENV expects bare KEY=value, so the "export "
      # prefix and the quotes are stripped — otherwise every variable is lost
      # and the suite fails on the first required one.
      - name: Seed the exercise fixture
        run: |
          cd moodle
          php mod/elang/tests/playwright/seed.php > /tmp/elang-seed.env
          echo "Seeded variables:"
          sed -n "s/^export \([A-Z_][A-Z_]*\)=.*/  \1/p" /tmp/elang-seed.env
          sed -n "s/^export \([A-Z_][A-Z_]*\)='\(.*\)'$/\1=\2/p" \
            /tmp/elang-seed.env >> "$GITHUB_ENV"

      - name: Install Playwright and browsers
        run: |
          cd moodle/mod/elang/tests/playwright
          # `npm ci` without a lockfile aborts with its own usage text, which
          # says nothing about why. The lockfile is committed, so its absence
          # means this run is against a ref that predates it — most often the
          # default branch, because the "Run workflow" button starts there
          # unless another branch is picked in the selector.
          if [ ! -f package-lock.json ]; then
            echo "tests/playwright/package-lock.json fehlt in diesem Ref."
            echo "Ref: $GITHUB_REF_NAME (SHA $GITHUB_SHA)"
            echo "Die Datei ist Teil des Plugins. Fehlt sie, laeuft dieser Job"
            echo "gegen einen aelteren Stand - im Branch-Selektor den Branch"
            echo "waehlen, der sie enthaelt, oder ihn in den Default-Branch"
            echo "mergen."
            exit 1
          fi
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: |
          cd moodle/mod/elang/tests/playwright
          # PHP's built-in server is single-threaded unless PHP_CLI_SERVER_WORKERS
          # is set, and a Moodle page pulls many subresources in parallel — one
          # worker stalls as soon as a browser hits it. The server is started
          # inside THIS step: one started in an earlier step does not reliably
          # survive into the next, which surfaces as a browser run against a
          # target that has already gone away.
          #
          # Bound to 127.0.0.1 rather than "localhost": the built-in server
          # listens on a single address, while clients may resolve "localhost"
          # to ::1 and report connection errors that look like site failures.
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t "$GITHUB_WORKSPACE/moodle" \
            >/tmp/moodle-server.log 2>&1 &
          ready=0
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8000/login/index.php || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 3
          done
          if [ "$ready" != "1" ]; then
            echo "Moodle wurde nicht erreichbar (letzter HTTP-Status: $code); Serverlog:"
            tail -50 /tmp/moodle-server.log
            exit 1
          fi
          npm test

      - name: Show the tail of the server log on failure
        if: failure()
        run: tail -100 /tmp/moodle-server.log || true

      # Two mutually exclusive artefacts, chosen by outcome.
      #
      # Green: the full report including videos — it documents the intended
      # journey and its screenshots are reused as illustrations.
      #
      # Red: only the directories of the tests that actually failed, and without
      # videos. Playwright keeps a directory per test, so a failed run's evidence
      # is a small subset of a report that otherwise runs to tens of megabytes.
      - name: Collect the failed tests only
        if: failure()
        run: |
          src="moodle/mod/elang/tests/playwright/test-results"
          dest="$RUNNER_TEMP/playwright-failures"
          rm -rf "$dest"
          mkdir -p "$dest"
          found=0
          # error-context.md is written for failures only, so its presence marks
          # the directory.
          while IFS= read -r ctx; do
            dir=$(dirname "$ctx")
            cp -a "$dir" "$dest/"
            found=1
          done < <(find "$src" -name error-context.md 2>/dev/null)
          if [ "$found" = "1" ]; then
            find "$dest" -name '*.webm' -delete
            echo "Fehlerhafte Tests eingesammelt:"
            ls -1 "$dest"
          else
            echo "Keine Fehlerverzeichnisse gefunden."
          fi

      # The complete log goes into the failure bundle rather than the job output:
      # a request log of a full browser run is long and only its end is readable
      # inline. Compressed because such logs grow quickly. Placed AFTER the
      # collecting step, which clears the directory first.
      - name: Add the server log to the failure bundle
        if: failure()
        run: |
          dest="$RUNNER_TEMP/playwright-failures"
          mkdir -p "$dest"
          if [ -s /tmp/moodle-server.log ]; then
            gzip -c /tmp/moodle-server.log > "$dest/moodle-server.log.gz"
            echo "Serverlog beigelegt ($(du -h /tmp/moodle-server.log | cut -f1) unkomprimiert)."
          else
            echo "Kein Serverlog vorhanden."
          fi

      - name: Upload failures only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: ${{ runner.temp }}/playwright-failures
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload full report with videos
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-with-videos
          path: |
            moodle/mod/elang/tests/playwright/playwright-report
            moodle/mod/elang/tests/playwright/test-results
          retention-days: 7
          if-no-files-found: ignore
